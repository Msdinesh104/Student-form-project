<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Details</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-100 via-purple-100 to-blue-200 p-6">

  <div class="w-full max-w-5xl bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-8 space-y-8 border border-gray-200">
    <!-- Title -->
    <h1 class="text-3xl md:text-4xl font-extrabold text-center text-blue-700 tracking-wide">
      STUDENT DETAILS
    </h1>

    <!-- Form Section -->
    <div class="bg-gradient-to-br from-blue-50 to-purple-50 rounded-2xl p-6 shadow-md">
      <h2 class="text-2xl font-semibold text-gray-700 mb-4 text-center">STUDENT FORM</h2>

      <form id="studentForm" class="grid gap-4 md:grid-cols-2">
        <input type="text" id="name" placeholder="Full Name" class="border border-gray-300 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
        <input type="number" id="age" placeholder="Age" class="border border-gray-300 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" required>

        <div class="flex items-center gap-4">
          <label class="font-medium text-gray-600">Gender:</label>
          <label class="flex items-center gap-1"><input type="radio" name="gender" value="Male" checked> Male</label>
          <label class="flex items-center gap-1"><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <select id="course" class="border border-gray-300 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" required>
          <option value="">Select Course</option>
          <option>Python</option>
          <option>JavaScript</option>
          <option>Java</option>
          <option>Ruby</option>
        </select>

        <input type="email" id="email" placeholder="E-mail Address" class="border border-gray-300 rounded-xl px-4 py-2 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none md:col-span-2" required>

        <button type="submit" class="bg-gradient-to-r from-blue-500 to-purple-500 text-white font-semibold px-4 py-2 rounded-xl hover:scale-105 transition-transform shadow-md md:col-span-2">
          Save
        </button>
      </form>
    </div>

    <!-- Table Section -->
    <div class="bg-gradient-to-br from-purple-50 to-blue-50 rounded-2xl p-6 shadow-md">
      <h2 class="text-2xl font-semibold text-gray-700 mb-4 text-center">STUDENT LIST</h2>

      <div class="overflow-x-auto">
        <table class="w-full border border-gray-300 text-center text-sm rounded-xl overflow-hidden">
          <thead class="bg-gradient-to-r from-blue-400 to-purple-400 text-white">
            <tr>
              <th class="border px-4 py-2">Name</th>
              <th class="border px-4 py-2">Age</th>
              <th class="border px-4 py-2">Course</th>
              <th class="border px-4 py-2">Gender</th>
              <th class="border px-4 py-2">Email</th>
              <th class="border px-4 py-2">Action</th>
            </tr>
          </thead>
          <tbody id="studentTable" class="bg-white">
            <tr class="hover:bg-gray-100 transition">
              <td class="border px-4 py-2">Arun</td>
              <td class="border px-4 py-2">22</td>
              <td class="border px-4 py-2">Ruby</td>
              <td class="border px-4 py-2">Male</td>
              <td class="border px-4 py-2">arun003@gmail.com</td>
              <td class="border px-4 py-2 space-x-2">
                <button class="bg-yellow-400 text-white px-3 py-1 rounded-lg hover:bg-yellow-500 shadow-sm transition editBtn">Edit</button>
                <button class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 shadow-sm transition deleteBtn">Delete</button>
              </td>
            </tr>
            <tr class="hover:bg-gray-100 transition">
              <td class="border px-4 py-2">Kumar</td>
              <td class="border px-4 py-2">23</td>
              <td class="border px-4 py-2">Java</td>
              <td class="border px-4 py-2">Male</td>
              <td class="border px-4 py-2">kumar_c@gmail.com</td>
              <td class="border px-4 py-2 space-x-2">
                <button class="bg-yellow-400 text-white px-3 py-1 rounded-lg hover:bg-yellow-500 shadow-sm transition editBtn">Edit</button>
                <button class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 shadow-sm transition deleteBtn">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const form = document.getElementById('studentForm');
    const table = document.getElementById('studentTable');

    // Add New Student
    form.addEventListener('submit', e => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const age = document.getElementById('age').value;
      const course = document.getElementById('course').value;
      const email = document.getElementById('email').value;
      const gender = document.querySelector('input[name="gender"]:checked').value;

      const newRow = document.createElement('tr');
      newRow.classList.add("hover:bg-gray-100", "transition");
      newRow.innerHTML = `
        <td class="border px-4 py-2">${name}</td>
        <td class="border px-4 py-2">${age}</td>
        <td class="border px-4 py-2">${course}</td>
        <td class="border px-4 py-2">${gender}</td>
        <td class="border px-4 py-2">${email}</td>
        <td class="border px-4 py-2 space-x-2">
          <button class="bg-yellow-400 text-white px-3 py-1 rounded-lg hover:bg-yellow-500 shadow-sm transition editBtn">Edit</button>
          <button class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 shadow-sm transition deleteBtn">Delete</button>
        </td>
      `;

      table.appendChild(newRow);
      form.reset();
      attachRowEvents(newRow);
    });

    // Attach edit/delete button 
    function attachRowEvents(row) {
      const editBtn = row.querySelector(".editBtn");
      const deleteBtn = row.querySelector(".deleteBtn");

      deleteBtn.addEventListener("click", () => row.remove());

      editBtn.addEventListener("click", () => {
        const box = row.querySelectorAll("td");
        if (editBtn.textContent === "Edit") {
          for (let i = 0; i < 5; i++) {
            const input = document.createElement("input");
            input.value = box[i].textContent;
            input.className = "border border-gray-300 rounded-md px-2 py-1 w-full";
            box[i].innerHTML = "";
            box[i].appendChild(input);
          }
          editBtn.textContent = "Save";
          editBtn.classList.replace("bg-yellow-400", "bg-green-500");
        } else {
          const inputs = row.querySelectorAll("input");
          inputs.forEach((input, i) => {
            box[i].textContent = input.value;
          });
          editBtn.textContent = "Edit";
          editBtn.classList.replace("bg-green-500", "bg-yellow-400");
        }
      });
    }

    // Attach events to initial rows
    document.querySelectorAll("#studentTable tr").forEach(attachRowEvents);
  </script>

</body>
</html>
